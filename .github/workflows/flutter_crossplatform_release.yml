name: Release Flutter (APK, AAB signÃ©s & Web)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  verify:
    name: Analyse statique
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Vérification conformité Google Play
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/check_play_compliance.ps1

  build:
    name: Build & Publish (APK / AAB / Web)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $pub = Get-Content pubspec.yaml -Raw
          $ver = ([regex]::Match($pub, '(?m)^version:\s*(\S+)\+(\S+)')).Groups
          $name = $ver[1].Value
          # Google Play exige un versionCode strictement croissant par import :
          # on prend le maximum entre le build number de pubspec et le nÂ° de run CI.
          $pubCode = [int]$ver[2].Value
          $code = [Math]::Max($pubCode, [int]$env:GITHUB_RUN_NUMBER)
          $isTag = $env:GITHUB_REF -like 'refs/tags/*'
          if ($isTag) {
            $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          } else {
            $tag = "build-$env:GITHUB_RUN_NUMBER"
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=v$name+$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "isTag=$isTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw 'ANDROID_KEYSTORE_BASE64 secret manquant' }
          $bytes = [Convert]::FromBase64String(($env:KEYSTORE_B64 -replace '\s', ''))
          [IO.File]::WriteAllBytes("$PWD/android/app/upload-keystore.jks", $bytes)

      - name: Write key.properties
        shell: pwsh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          @"
          storePassword=$env:KEYSTORE_PASS
          keyPassword=$env:KEY_PASS
          keyAlias=$env:KEY_ALIAS
          storeFile=upload-keystore.jks
          "@ | Out-File -FilePath android/key.properties -Encoding utf8

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }}

      - name: Build APKs (universal + split per ABI)
        run: |
          flutter build apk --release --build-number=${{ steps.version.outputs.code }}
          flutter build apk --release --split-per-abi --build-number=${{ steps.version.outputs.code }}

      - name: Build Flutter Web (WasmGC)
        run: flutter build web --release --wasm

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item build/app/outputs/flutter-apk/*.apk dist-release -Force
          Copy-Item build/app/outputs/bundle/release/*.aab dist-release -Force
          Copy-Item build/web dist-release/web -Recurse -Force
          Compress-Archive -Path dist-release/web -DestinationPath dist-release/flutter-news-web.zip -Force
          Remove-Item dist-release/web -Recurse -Force
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flutter-release-${{ steps.version.outputs.tag }}
          path: apps/mobile/dist-release
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.isTag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DZ News ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.isTag == 'false' }}
          generate_release_notes: true
          files: |
            apps/mobile/dist-release/*.apk
            apps/mobile/dist-release/*.aab
            apps/mobile/dist-release/flutter-news-web.zip
          body: |
            DZ News - ${{ steps.version.outputs.version }}

            Artefacts: APK (universal + split per ABI), AAB (Play Store), web zip (WasmGC).
            Builds Android signees avec le keystore de release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-hosting:
    name: Deploy Flutter Web to Firebase Hosting
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Flutter Web (WasmGC)
        working-directory: apps/mobile
        run: flutter build web --release --wasm

      - name: 'Deploy to Firebase Hosting (target mobile)'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: 'device-streaming-ccab91bb'
          channelId: live
          target: mobile