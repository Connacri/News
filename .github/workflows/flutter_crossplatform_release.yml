name: Flutter Multiplatform Release (APK, AAB & Web)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter-build:
    name: Build Flutter APK, AAB and Web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: 📱 Build Android APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 📦 Build Android App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: 🌐 Build Flutter Web (WebAssembly WasmGC)
        working-directory: flutter_app
        run: flutter build web --release --wasm

      - name: 🚀 Deploy Flutter Web to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: 'basic-epsilon-lsmzh'
          channelId: live
        if: github.ref == 'refs/heads/main'

      - name: 📦 Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
