name: flutter_news_osint
description: "Application Flutter Cross-Platform de News Tech Quotidiennes, Google Patents, Blueprints et OSINT avec Firebase."
publish_to: "none"
version: 1.0.1+15

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Suite Multiplateforme (Android, iOS, Web, macOS, Windows, Linux)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Networking & Open Source Public APIs (HackerNews, GitHub, Dev.to)
  http: ^1.2.2
  url_launcher: ^6.3.0
  intl: ^0.20.2

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # UI Design, Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/splash.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
